name: 新規スキル追加リクエスト
description: 新しい skill の追加を依頼する
labels: ["new-prompt"]
body:
  - type: input
    id: skill-name
    attributes:
      label: skill 名の案
      description: 単一の凝集した概念を表す名前にする。A-and-B のような連結は避ける
      placeholder: 例: database-reliability
    validations:
      required: true

  - type: textarea
    id: usecase
    attributes:
      label: ユースケース
      description: どんな場面で使いたいか、どんな課題を解決したいかを記述してください
      placeholder: |
        例: DBマイグレーションのレビュー時に、安全性・後方互換性・パフォーマンスの観点を列挙したチェックリストが欲しい
    validations:
      required: true

  - type: textarea
    id: example
    attributes:
      label: 期待する入出力の例（任意）
      description: どんな入力を与えて、どんな出力を得たいかのイメージがあれば記述してください
      placeholder: |
        入力: DBマイグレーションファイルのコード
        出力: レビュー観点ごとのチェック結果
